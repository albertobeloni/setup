# ------------------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------------------

[output.eDP-1]
mode = "1920x1080@144.003"
position = [0, 0]
scale = 1.0

[output."AOC 24G4 12VP4XA003072"]
mode = "1920x1080@180.003"
position = [1920, 0]
scale = 1.0
hdr = "auto"
vrr = "fullscreen"

# ------------------------------------------------------------------------------
# Events
# ------------------------------------------------------------------------------

[events]
lid_close = "umbriel msg output-disable:eDP-1"
lid_open = "umbriel msg output-enable:eDP-1"
