# ------------------------------------------------------------------------------
# Appearance
# ------------------------------------------------------------------------------

[appearance]
border_width = 0
corner_radius = 4
drag_opacity = 1.0
opaque_fullscreen = true
outer_border_width = 0
prefer_no_csd = true

[appearance.blur]
brightness = 1.0
contrast = 1.0
enabled = true
noise = 0.02
optimized = true
passes = 2
radius = 2
saturation = 1.0

[appearance.shadow]
enabled = false
softness = 0
offset_x = 0
offset_y = 0

[appearance.title_bar]
# mode = "negotiated"
mode = "off"
height = 40
font = "IBM Plex Sans 9"
buttons = []
