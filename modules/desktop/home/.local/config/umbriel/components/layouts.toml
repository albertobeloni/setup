# ------------------------------------------------------------------------------
# Layouts
# ------------------------------------------------------------------------------

[layout]
mode = "scrolling"
gap = 16
extent_presets = [0.333, 0.5, 0.667]
new_exits_fullscreen = []
client_maximize = "column"

[layout.struts]
top = 16
right = 24
bottom = 40
left = 24

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "on_overflow"

[layout.dwindle]
preserve_split = false
new_toward_cursor = false

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true
new_becomes_master = false

[layout.tabs]
default_display = "normal"
new_tab_position = "end"
wrap_focus = true
scroll_switches_tabs = true
middle_click_closes = false
