# ------------------------------------------------------------------------------
# Windows
# ------------------------------------------------------------------------------

[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.is_alone = true
default_maximize = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 8, y = 8, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.app_id = "^org.gnome.Calculator$"
default_floating = true

[[window_rule]]
match.app_id = "^org.gnome.clocks$"
default_floating = true

[[window_rule]]
match.app_id = "^org.gnome.Nautilus$"
default_floating = true

[[window_rule]]
match.app_id = "^org.gnome.Snapshot$"
default_floating = true

[[window_rule]]
match.app_id = "^org.gnome.Loupe$"
default_floating = true

[[window_rule]]
match.app_id = "^org.gnome.Weather$"
default_floating = true

[[window_rule]]
match.app_id = "^org.gnome.Showtime$"
default_floating = true
