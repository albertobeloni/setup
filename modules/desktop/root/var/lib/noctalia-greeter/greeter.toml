[session]
default = "Umbriel"

[appearance]
corner_radius_scale = 0.4
font_family = "sans-serif"
hide_logo = true
password_style = "default"
power_buttons_position = "bottom-right"
scheme_selector_position = "hidden"
theme_mode = "dark"

[appearance.wallpaper]
fill_color = "#000000"

[clock]
enabled = false

[idle]
timeout = 300

[cursor]
theme = "Adwaita"
size = 24

[keyboard]
layout = "br"
