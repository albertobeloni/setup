<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

	<selectfont>
		<rejectfont>
			<glob>/usr/share/fonts/encodings/*</glob>
			<glob>/usr/share/fonts/gnu-free/*</glob>
			<glob>/usr/share/fonts/gsfonts/*</glob>
		</rejectfont>
	</selectfont>

	<alias binding="same">
		<family>sans-serif</family>
		<prefer>
			<family>Noto Sans</family>
			<family>Noto Sans CJK SC</family>
			<family>Noto Color Emoji</family>
			<family>Symbols Nerd Font</family>
		</prefer>
	</alias>

	<alias binding="same">
		<family>serif</family>
		<prefer>
			<family>Noto Serif</family>
			<family>Noto Serif CJK SC</family>
			<family>Noto Color Emoji</family>
			<family>Symbols Nerd Font</family>
		</prefer>
	</alias>

	<alias binding="same">
		<family>monospace</family>
		<prefer>
			<family>Noto Sans Mono</family>
			<family>Noto Sans Mono CJK SC</family>
			<family>Symbols Nerd Font Mono</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>

	<alias binding="same">
		<family>terminal</family>
		<prefer>
			<family>Noto Sans Mono</family>
			<family>Noto Sans Mono CJK SC</family>
			<family>Symbols Nerd Font Mono</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>

	<alias binding="same">
		<family>emoji</family>
		<prefer>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>

	<alias binding="same">
		<family>system-ui</family>
		<prefer>
			<family>sans-serif</family>
		</prefer>
	</alias>
	<alias binding="same">
		<family>ui-sans-serif</family>
		<prefer>
			<family>sans-serif</family>
		</prefer>
	</alias>
	<alias binding="same">
		<family>ui-serif</family>
		<prefer>
			<family>serif</family>
		</prefer>
	</alias>
	<alias binding="same">
		<family>ui-monospace</family>
		<prefer>
			<family>monospace</family>
		</prefer>
	</alias>

</fontconfig>
