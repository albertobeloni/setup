theme = "base16_terminal"

[editor]
line-number = "absolute"
mouse = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "underline"
normal = "underline"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "file-base-name"]
center = []
right = []
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[editor.indent-guides]
render = true
