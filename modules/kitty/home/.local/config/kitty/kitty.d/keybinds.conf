map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+c copy_or_interrupt
map --allow-fallback=shifted,ascii ctrl+shift+x copy_and_clear_or_interrupt
