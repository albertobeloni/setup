[mgr]
ratio = [1, 1, 1]
sort_by = "alphabetical"
sort_sensitive = true
sort_dir_first = true
show_hidden = true
linemode = "none"

[preview]
wrap = "no"
tab_size = 4

[plugin]
prepend_previewers = [
	{ mime = "text/*", run = "treesitter" },
	{ mime = "application/{mbox,javascript,wine-extension-ini,json,ndjson}", run = "treesitter" },
]
